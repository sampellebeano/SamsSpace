<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#646cff" stroke="#535bf2" stroke-width="2"/>

  <!-- Clock face -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <!-- Clock hands pointing to 5 AM -->
  <!-- Hour hand pointing to 5 -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand pointing to 12 -->
  <line x1="32" y1="32" x2="44" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>

  <!-- Text "5AM" -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">5AM</text>
</svg>